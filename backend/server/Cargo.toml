[package]
name = "guanfu-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
guanfu-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
