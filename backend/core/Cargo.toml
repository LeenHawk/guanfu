[package]
name = "guanfu-core"
version = "0.1.0"
edition = "2021"

[dependencies]
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
  "macros",
  "entity-registry",
  "schema-sync",
  "with-chrono",
] }
gproxy-protocol = "2.5"
gproxy-transform = "2.5"
gproxy-tokenize = { version = "2.5", features = ["tiktoken"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
