name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri crate 依赖系统 webkit,不装这些连 cargo check 都过不了。
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all --check
        working-directory: backend
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: backend
      - run: cargo test --workspace
        working-directory: backend
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build
      # bindings 入库,漂了就说明改了 Rust 类型却没重新生成。
      - name: 校验 ts-rs bindings 是最新的
        run: |
          pnpm gen:bindings
          git diff --exit-code -- frontend/src/lib/bindings
