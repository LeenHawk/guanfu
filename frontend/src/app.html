<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link id="app-favicon" rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      const savedTheme = localStorage.getItem("guanfu-theme") || "system";
      const dark =
        savedTheme === "dark" ||
        (savedTheme === "system" &&
          matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      document.getElementById("app-favicon").href = dark
        ? "%sveltekit.assets%/favicon-dark.svg"
        : "%sveltekit.assets%/favicon.png";
    </script>
    <title>观复</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
