<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link id="app-favicon" rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      const savedTheme = localStorage.getItem("guanfu-theme") || "system";
      const dark =
        savedTheme === "dark" ||
        (savedTheme === "system" &&
          matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      document.getElementById("app-favicon").href = dark
        ? "%sveltekit.assets%/favicon-dark.svg"
        : "%sveltekit.assets%/favicon.png";
      const locale = localStorage.getItem("PARAGLIDE_LOCALE");
      // 与 $lib/i18n/locale.ts 的 htmlLang 保持一致:繁体要带字形子标签,
      // 否则 CSS 的 :lang(zh-Hant) 选不到繁体字体。
      if (locale)
        document.documentElement.lang =
          locale === "zh-TW" ? "zh-Hant-TW" : locale;
    </script>
    <title>观复</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
