<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232936"/>
      <stop offset="1" stop-color="#151A24"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3447"/>
      <stop offset="1" stop-color="#1D2534"/>
    </linearGradient>
    <clipPath id="win">
      <circle cx="512" cy="452" r="276"/>
    </clipPath>
  </defs>

  <!-- 底：墨蓝渐变圆角方 + 鎏金内框 -->
  <rect x="0" y="0" width="1024" height="1024" rx="212" fill="url(#bg)"/>
  <rect x="46" y="46" width="932" height="932" rx="178" fill="none"
        stroke="#C9962E" stroke-width="7" opacity="0.65"/>

  <!-- 月洞窗环：外鎏金 → 朱砂 → 内鎏金 -->
  <circle cx="512" cy="452" r="330" fill="#C9962E"/>
  <circle cx="512" cy="452" r="320" fill="#1B212D"/>
  <circle cx="512" cy="452" r="314" fill="#C4402F"/>
  <circle cx="512" cy="452" r="284" fill="#C9962E"/>
  <circle cx="512" cy="452" r="276" fill="url(#sky)"/>

  <!-- 窗内夜景 -->
  <g clip-path="url(#win)">
    <!-- 明月与光晕 -->
    <circle cx="622" cy="342" r="118" fill="#F2E6C8" opacity="0.16"/>
    <circle cx="622" cy="342" r="80" fill="#F2E6C8"/>
    <!-- 星子 -->
    <g fill="#E9D9AE">
      <path d="M 400 268 l 7 16 16 7 -16 7 -7 16 -7 -16 -16 -7 16 -7 Z"/>
      <path d="M 462 216 l 5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z" opacity="0.8"/>
      <path d="M 340 348 l 4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" opacity="0.6"/>
    </g>
    <!-- 远山三叠（夜色青黛） -->
    <path d="M 206 566 Q 376 392 566 560 L 566 760 L 206 760 Z" fill="#3E5D5C"/>
    <path d="M 430 592 Q 612 412 828 600 L 828 760 L 430 760 Z" fill="#31504E"/>
    <path d="M 140 648 Q 322 500 540 656 Q 664 718 898 646 L 898 770 L 140 770 Z" fill="#253F3E"/>
    <!-- 月下水波（亮色提出来） -->
    <g fill="none" stroke-linecap="round">
      <path d="M 280 690 q 38 -24 76 0 q 38 24 76 0 q 38 -24 76 0 q 38 24 76 0"
            stroke="#7FB0A2" stroke-width="13"/>
      <path d="M 318 728 q 38 -24 76 0 q 38 24 76 0 q 38 -24 76 0"
            stroke="#4E8E8B" stroke-width="13"/>
    </g>
  </g>

  <!-- 印章：回字纹（回 = 复） -->
  <rect x="466" y="826" width="92" height="92" rx="14" fill="#C4402F"/>
  <rect x="482" y="842" width="60" height="60" fill="#F2E6C8"/>
  <rect x="491" y="851" width="42" height="42" fill="#C4402F"/>
  <rect x="502" y="862" width="20" height="20" fill="#F2E6C8"/>
</svg>
